DWAPlannerROS:
  max_vel_x: 0.35
  min_vel_x: -0.05

  max_vel_y: 0
  min_vel_y: 0

  max_vel_trans: 0.35
  min_vel_trans: 0.05

  max_vel_theta: 0.8
  min_vel_theta: 0.2

  acc_lim_x: 2.5
  acc_lim_y: 2.5
  acc_lim_theta: 3.2

  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.1
  latch_xy_goal_tolerance: false

  sim_time: 3.5
  vx_samples: 20
  vy_samples: 0
  vth_samples: 40
  controller_frequency: 20.0

  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.01
  forward_point_distance: 0.0   #prevents oscilating near goal
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.05

  publish_traj_pc: true 
  publish_cost_grid_pc: true
